syntax = "proto3";

package auth_v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/radik-alt/SimpleGRPC/week_1/grpc/pkg/auth_v1;auth_v1";

service AuthV1 {

  // Create a new user
  rpc CreateUser(CreateUserRequest) returns (User);

  // Get user by id
  rpc GetUser(GetUserRequest) returns (User);

  // List users with pagination
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);

  // Update user fields by id (partial update)
  rpc UpdateUser(UpdateUserRequest) returns (User);

  // Delete user by id
  rpc DeleteUser(DeleteUserRequest) returns (google.protobuf.Empty);
}

// Entity mapped to table `auth`
message User {
  int64 id = 1;
  string name = 2;
  string password = 3;
  google.protobuf.Timestamp created_at = 4;
}

// Create
message CreateUserRequest {
  string name = 1;
  string password = 2;
}

// Read
message GetUserRequest {
  int64 id = 1;
}

// List
message ListUsersRequest {
  int32 limit = 1;   // number of items to return
  int32 offset = 2;  // number of items to skip
}

message ListUsersResponse {
  repeated User users = 1;
  int64 total_count = 2;
}

// Update (partial)
message UpdateUserRequest {
  int64 id = 1;
  google.protobuf.StringValue name = 2;
  google.protobuf.StringValue password = 3;
}

// Delete
message DeleteUserRequest {
  int64 id = 1;
}