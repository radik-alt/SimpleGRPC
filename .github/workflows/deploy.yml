name: CI/CD with Docker Compose

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

env:
  REGISTRY: "cr.selcloud.ru/radik-alt"
  IMAGE_NAME: "crud-server"
  CONTAINER_NAME: "crud-server-container"

jobs:
  determine-env:
    runs-on: ubuntu-latest
    outputs:
      env-name: ${{ steps.set-env.outputs.env }}
    steps:
      - name: Determine environment
        id: set-env
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "env=prod" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF}" == refs/heads/master ]]; then
            echo "env=stage" >> $GITHUB_OUTPUT
          else
            echo "env=dev" >> $GITHUB_OUTPUT

  build-and-push:
    runs-on: ubuntu-latest
    needs: determine-env
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Docker Compose services
        run: |
          APP_ENV=${{ needs.determine-env.outputs.env-name }} \
          docker-compose -f docker-compose.yml build

      - name: Push images to registry
        run: |
          TAG_NAME=$(echo $GITHUB_SHA | head -c7)
          docker-compose -f docker-compose.yml push

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy via SSH with Docker Compose
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSHKEY }}
          envs: REGISTRY,IMAGE_NAME,CONTAINER_NAME,GITHUB_SHA,APP_ENV
          script: |
            TAG_NAME=$(echo $GITHUB_SHA | head -c7)
            ENV_NAME=${{ needs.determine-env.outputs.env-name }}
            echo "Deploying environment: $ENV_NAME"

            # Передаем APP_ENV в контейнеры
            APP_ENV=$ENV_NAME docker-compose --env-file ./week_1/postgres/.env -f ./week_1/postgres/docker-compose.yml up -d
