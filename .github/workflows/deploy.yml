name: CI/CD with Docker Compose

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

env:
  REGISTRY: "cr.selcloud.ru/radik-alt"
  IMAGE_NAME: "crud-server"
  CONTAINER_NAME: "crud-server-container"

jobs:
  determine-env:
    runs-on: ubuntu-latest
    outputs:
      env-name: ${{ steps.set-env.outputs.env }}
    steps:
      - name: Determine environment
        id: set-env
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "env=prod" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF}" == refs/heads/master ]]; then
            echo "env=prod" >> $GITHUB_OUTPUT
          else
            echo "env=prod" >> $GITHUB_OUTPUT
          fi

  build-and-push:
    runs-on: ubuntu-latest
    needs: determine-env
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.26.0/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose version  

      - name: Build Docker Compose services
        run: |
          APP_ENV=${{ needs.determine-env.outputs.env-name }} \
          docker-compose -f ./week_1/postgres/docker-compose.yaml build

      - name: Push images to registry
        run: |
          TAG_NAME=$(echo $GITHUB_SHA | head -c7)
          docker-compose -f ./week_1/postgres/docker-compose.yaml push

  deploy:
    runs-on: ubuntu-latest
    needs: [determine-env, build-and-push]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Copy docker-compose and .env
        uses: appleboy/scp-action@v0.1.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSHKEY }}
          source: "week_1/postgres/docker-compose.yaml, week_1/postgres/.env"
          target: "/opt/app"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSHKEY }}
          script: |
            TAG_NAME=$(echo $GITHUB_SHA | head -c7)
            ENV_NAME=${{ needs.determine-env.outputs.env-name }}
            
            cd /opt/app
            
            # Логинимся в registry (если нужно)
            echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login cr.selcloud.ru -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin
            
            # Запускаем
            APP_ENV=$ENV_NAME docker-compose -f ./week_1/postgres/docker-compose.yaml up -d
